<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Patchwork Singapore — Quilt Plots</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div id="root"></div>

<!-- React + Babel (local) -->
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/babel.js"></script>

<!-- Real Singapore data bundle (rainfall 2024 daily-derived, ethnicity Census 2020, active dengue clusters) -->
<script src="real-data.js"></script>

<!-- Bundled weather snapshot (offline, no runtime fetch) -->
<script>
(async () => {
  try {
    const r = await fetch("data/sg-weather-snapshot.json");
    const j = await r.json();
    window.__LIVE_WEATHER = {
      forecasts: j.two_hr_forecast?.forecasts || [],
      timestamp: j.two_hr_forecast?.timestamp || null,
      live: false,
    };
  } catch (e) {}
  window.dispatchEvent(new CustomEvent("realdata-refreshed"));
})();
</script>

<!-- Data (vanilla JS) -->
<script src="data.js"></script>

<!-- Textile primitives -->
<script type="text/babel" src="textile.jsx"></script>

<!-- Tile component -->
<script type="text/babel" src="tile.jsx"></script>

<!-- Main app -->
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
